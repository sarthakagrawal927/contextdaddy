[package]
name = "memory-pack"
version = "0.1.2"
edition = "2021"
rust-version = "1.82"
description = "Pack local Claude Code and Codex sessions into a Memory Map archive"
license = "MIT"
repository = "https://github.com/Significant-Hobbies/chatgpt-memory-insights"

[[bin]]
name = "memory-pack"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
